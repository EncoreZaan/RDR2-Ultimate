name: Upstream data sync

# Pulls the community data (cycles, items, translations…) from
# jeanropke/RDR2CollectorsMap, validates it, runs the whole test-suite and only
# then commits it to main and redeploys. Upstream CODE is never imported here.

on:
  schedule:
    - cron: '23 1 * * *'
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      commit:
        description: Upstream commit SHA (empty = latest)
        required: false

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Fetch & validate upstream data
        id: sync
        run: npm run upstream:sync
        env:
          UPSTREAM_COMMIT: ${{ inputs.commit }}

      - name: Full test-suite on the new data
        if: steps.sync.outputs.changed == 'true'
        run: |
          npm run data
          npm run lint
          npm run typecheck
          npx vitest run
          npm run build
          npm run verify:dist

      - name: End-to-end tests on the new data
        if: steps.sync.outputs.changed == 'true'
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop
        env:
          CI: 'true'

      - name: Commit to main
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898237+github-actions[bot]@users.noreply.github.com'
          git add upstream/
          git commit -m "chore(data): sync upstream ${{ steps.sync.outputs.commit }}" -m "Files: ${{ steps.sync.outputs.files }}" -m "Cycle calendar now ends ${{ steps.sync.outputs.cycles_to }}."
          git push origin HEAD:main

      - name: Redeploy
        if: steps.sync.outputs.changed == 'true'
        run: |
          gh workflow run deploy.yml --ref main
          gh workflow run deploy-cloudflare.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Report a rejected upstream update
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Synchronisation upstream en échec';
            const body = `La synchronisation des données upstream a échoué (validation ou tests).\n\nRien n'a été intégré : l'application continue d'utiliser les dernières données valides.\n\nDétails : ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'upstream-sync' });
            if (issues.length) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['upstream-sync'] });
            }
