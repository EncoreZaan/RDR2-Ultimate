name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check that GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages disabled::Pages is not enabled for this repository (private repositories need GitHub Pro/Team/Enterprise). Enable it in Settings > Pages > Source: GitHub Actions, or use the Cloudflare Pages workflow. See docs/DEPLOYMENT.md."
          fi
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for /<repository>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify the bundle before publishing (no sources, no secrets)
        run: npm run verify:dist
      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test the live site
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$url" | grep -q "Collector"; then echo "✓ $url is live"; break; fi
            sleep 10
          done
          curl -fsS "${url}manifest.webmanifest" > /dev/null
          curl -fsS "${url}data/cycles.json" > /dev/null
          curl -fsS "${url}sw.js" > /dev/null
