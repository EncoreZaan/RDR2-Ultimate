name: Deploy (Cloudflare Pages — optional)

# Free alternative to GitHub Pages for PRIVATE repositories on the GitHub Free plan.
# Inactive until the two repository secrets below exist (see docs/DEPLOYMENT.md):
#   CLOUDFLARE_API_TOKEN   (permission: Account › Cloudflare Pages › Edit)
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: rdr2-ultimate
    steps:
      - name: Skip when Cloudflare is not configured
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set — skipping (this is expected if you use GitHub Pages)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci
      - name: Build (served at the domain root)
        if: steps.gate.outputs.enabled == 'true'
        run: npm run build && npm run verify:dist
        env:
          BASE_PATH: /
      - name: Deploy with Wrangler
        if: steps.gate.outputs.enabled == 'true'
        run: |
          npx --yes wrangler@4.140.0 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@4.140.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
