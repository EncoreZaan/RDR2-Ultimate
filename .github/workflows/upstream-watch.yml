name: Upstream watch

# Weekly report of upstream changes that are NOT synchronised automatically
# (application code, new data sources). Opens or updates a tracking issue.

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Build report
        id: report
        run: node scripts/upstream-report.ts --out upstream-report.md && cat upstream-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open / update the tracking issue
        if: steps.report.outputs.needs_review == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('upstream-report.md', 'utf8');
            const title = 'Évolutions upstream à examiner';
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'all', labels: 'upstream', per_page: 1 });
            if (issues.length) {
              await github.rest.issues.update({ ...context.repo, issue_number: issues[0].number, body, state: 'open' });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['upstream'] });
            }
